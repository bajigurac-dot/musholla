<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="emGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075B4A"/>
      <stop offset="100%" stop-color="#04362C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCEE21"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA7C11"/>
    </linearGradient>
  </defs>
  <!-- Outer Circular Shield -->
  <circle cx="100" cy="100" r="94" fill="url(#emGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="rgba(212,175,55,0.4)" stroke-width="1.5" stroke-dasharray="4 2"/>
  
  <!-- Mosque Dome and Minarets -->
  <path d="M100 38 C90 55 75 75 75 96 L125 96 C125 75 110 55 100 38 Z" fill="url(#goldGrad)"/>
  <!-- Crescent on top -->
  <path d="M100 28 A 6 6 0 1 0 102 36 A 4.5 4.5 0 1 1 100 28 Z" fill="url(#goldGrad)"/>
  <!-- Minaret Left -->
  <rect x="58" y="70" width="8" height="42" fill="url(#goldGrad)" rx="1"/>
  <polygon points="62,60 58,70 66,70" fill="url(#goldGrad)"/>
  <!-- Minaret Right -->
  <rect x="134" y="70" width="8" height="42" fill="url(#goldGrad)" rx="1"/>
  <polygon points="138,60 134,70 142,70" fill="url(#goldGrad)"/>
  
  <!-- Mosque Building Base & Arch -->
  <rect x="68" y="96" width="64" height="24" fill="#FFFFFF" opacity="0.95"/>
  <path d="M88 120 L88 106 C88 100 112 100 112 106 L112 120 Z" fill="url(#emGrad)"/>

  <!-- Text -->
  <text x="100" y="148" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="14" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">AR-RAHMAN</text>
  <text x="100" y="166" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="600" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">MUSHOLLA</text>
  <text x="100" y="180" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.7)" text-anchor="middle">EST. 1990 • PERIUK</text>
</svg>
