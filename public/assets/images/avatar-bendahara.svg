<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="bg-bendahara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8F5E9" />
      <stop offset="100%" stop-color="#C8E6C9" />
    </linearGradient>
    <linearGradient id="peci-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D3748" />
      <stop offset="50%" stop-color="#1A202C" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="skin-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD8B5" />
      <stop offset="100%" stop-color="#EBB68A" />
    </linearGradient>
    <linearGradient id="shirt-bendahara" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F766E" />
      <stop offset="100%" stop-color="#044E46" />
    </linearGradient>
    <clipPath id="circle-clip-1">
      <circle cx="60" cy="60" r="60" />
    </clipPath>
  </defs>

  <g clip-path="url(#circle-clip-1)">
    <!-- Background Circle -->
    <rect width="120" height="120" fill="url(#bg-bendahara)" />

    <!-- Subtle decorative glow -->
    <circle cx="60" cy="45" r="42" fill="#FFFFFF" opacity="0.35" />

    <!-- Baju Koko / Badan -->
    <path d="M18 120 C22 96 38 84 60 84 C82 84 98 96 102 120 Z" fill="url(#shirt-bendahara)" />
    <!-- Kerah Koko -->
    <path d="M52 84 L60 96 L68 84 Z" fill="#FCD8B5" />
    <path d="M48 83 C54 87 66 87 72 83 L68 97 C64 99 56 99 52 97 Z" fill="#0D5F58" />
    <!-- Garis Kancing Emas -->
    <line x1="60" y1="96" x2="60" y2="120" stroke="#D4AF37" stroke-width="2" stroke-linecap="round" />
    <circle cx="60" cy="102" r="1.5" fill="#F1E2BA" />
    <circle cx="60" cy="110" r="1.5" fill="#F1E2BA" />
    <circle cx="60" cy="118" r="1.5" fill="#F1E2BA" />

    <!-- Leher -->
    <rect x="52" y="70" width="16" height="18" rx="4" fill="url(#skin-grad-1)" />

    <!-- Telinga -->
    <circle cx="37" cy="58" r="6.5" fill="#EBB68A" />
    <circle cx="83" cy="58" r="6.5" fill="#EBB68A" />
    <circle cx="37" cy="58" r="4" fill="#D99B6A" opacity="0.5" />
    <circle cx="83" cy="58" r="4" fill="#D99B6A" opacity="0.5" />

    <!-- Wajah / Kepala -->
    <ellipse cx="60" cy="58" rx="22" ry="24" fill="url(#skin-grad-1)" />

    <!-- Alis -->
    <path d="M44 49 C47 47 52 47 55 49" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" />
    <path d="M65 49 C68 47 73 47 76 49" stroke="#374151" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Mata Ramah -->
    <ellipse cx="49" cy="53" rx="2.5" ry="2.5" fill="#1F2937" />
    <ellipse cx="71" cy="53" rx="2.5" ry="2.5" fill="#1F2937" />
    <circle cx="50" cy="52" r="0.8" fill="#FFFFFF" />
    <circle cx="72" cy="52" r="0.8" fill="#FFFFFF" />

    <!-- Hidung -->
    <path d="M60 54 L58.5 61 L61.5 61" stroke="#D99B6A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none" />

    <!-- Senyum Ramah -->
    <path d="M52 66 C56 71 64 71 68 66" stroke="#9A3412" stroke-width="2" stroke-linecap="round" fill="none" />

    <!-- Kumis Rapi Tipis -->
    <path d="M51 64 C55 63 58 64 59 65" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M69 64 C65 63 62 64 61 65" stroke="#374151" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Peci / Kopiah Hitam Khas Indonesia -->
    <path d="M36 44 C36 40 40 26 60 25 C80 26 84 40 84 44 Z" fill="url(#peci-grad-1)" />
    <!-- Lis Bawah Peci -->
    <path d="M35 44 C42 46 78 46 85 44 L85 47 C78 49 42 49 35 47 Z" fill="#111827" />
    <!-- Aksen Bordir Emas Halus di Puncak Peci -->
    <path d="M52 26 C56 25.5 64 25.5 68 26" stroke="#D4AF37" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.7" />
  </g>
</svg>
